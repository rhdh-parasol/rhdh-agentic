name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # pre-commit framework is a Python tool
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backstage-agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/backstage-agent/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
